<div><div class="chart-head"><h3>{{ title }}</h3><span>{{ detail }}</span></div><div class="chart">{% if chart.line %}<svg viewBox="0 0 640 170" preserveAspectRatio="none" aria-label="{{ title }}"><path class="chart-area {% if navy %}navy{% endif %}" d="{{ chart.area }}"/><path class="chart-line {% if navy %}navy{% endif %}" d="{{ chart.line }}"/></svg>{% else %}<div class="chart-empty">Data akan muncul setelah pengukuran tersedia.</div>{% endif %}</div><div class="chart-axis"><span>Pengukuran awal</span><span>Rentang terukur</span><span>Terbaru</span></div></div>
