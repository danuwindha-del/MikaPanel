[project]
name = "mikapanels"
version = "0.1.0"
description = "MikaPanels hosting control panel and MychaHost storefront"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3", "gunicorn>=23,<24", "requests>=2.32.4,<3",
  "rich>=14,<15", "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-django>=4.11,<5"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "hosting*", "storefront*", "common*"]
